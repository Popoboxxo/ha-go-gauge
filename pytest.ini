[pytest]
# This repo stubs homeassistant modules itself (see tests/test_sensor_wiring.py)
# instead of using pytest-homeassistant-custom-component, whose eager import of
# the real homeassistant package can crash on unrelated dependency mismatches
# (e.g. pyOpenSSL/cryptography) on a dev machine that also has HA installed.
addopts = -p no:homeassistant
