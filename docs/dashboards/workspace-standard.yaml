# =============================================================================
# Go Gauge - Standard-Dashboard (nur eingebaute Home-Assistant-Karten)
# -----------------------------------------------------------------------------
# Zweck   : Nutzung, Prognose, Pace, Restzeit, Steuerung und Modell-Katalog
#           eines Go-Gauge-Workspaces auf einem kompakten Dashboard.
# Custom  : benoetigte Custom-Ressourcen: keine (alle Karten sind HA-Bordmittel).
# Bindung : `WS` ist ein Platzhalter fuer den Workspace-Slug in der entity_id.
#           Vor der Verwendung durch den echten Slug ersetzen. entity_ids NIE
#           aus dem Friendly Name raten, sondern ueber die unique_id-Suffixe
#           der Entity-Registry ermitteln (siehe entity-map.yaml und
#           docs/dashboards/README.md).
# Slugs   : Kanonische englische entity_id-Slugs seit v1.5.0 (v7-Migration;
#           Quelle: custom_components/go_gauge/const.py ENTITY_ID_MIGRATION).
# Hinweis : `statistics-graph`/`history-graph`/`gauge`/`grid` sind ab HA 2024.6
#           verfuegbar (hacs.json-Mindestversion).
# =============================================================================
title: Go Gauge
views:
  - title: "Go Gauge — WS"
    path: go-gauge
    icon: mdi:gauge
    cards:
      # --- Kopfzeile: Abo-, API-Status und Status/Note je Fenster ------------
      - type: markdown
        content: |
          ## Go Gauge — WS

          **Abo:** {{ 'aktiv' if is_state('binary_sensor.go_gauge_WS_subscription_active', 'on') else 'kein Abo / unbekannt' }} · **API:** {{ 'erreichbar' if is_state('binary_sensor.go_gauge_api_reachable', 'on') else 'nicht erreichbar' }}

          {% for win, label in [('5h_rolling', '5h rolling'), ('weekly', 'Weekly'), ('monthly', 'Monthly')] %}
          - **{{ label }}:** {{ state_attr('sensor.go_gauge_WS_' ~ win ~ '_usage', 'status') or 'unbekannt' }}{% set note = state_attr('sensor.go_gauge_WS_' ~ win ~ '_usage', 'note') %}{% if note %} — {{ note }}{% endif %}
          {% endfor %}

      # --- Fenster: 5h rolling ----------------------------------------------
      - type: grid
        columns: 2
        square: false
        cards:
          # Die severity-Schwellen MUESSEN zu den Number-Entities passen:
          # number.go_gauge_warning_threshold_WS (Gruen/Gelb, Default 80)
          # number.go_gauge_pace_red_limit_WS (Gelb/Rot, Default 100).
          - type: gauge
            entity: sensor.go_gauge_WS_5h_rolling_usage
            name: 5h rolling
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 80
              red: 100
          - type: entities
            entities:
              - entity: sensor.go_gauge_WS_5h_rolling_pace
                name: Pace
              - entity: sensor.go_gauge_WS_5h_rolling_forecast
                name: Prognose
              - entity: sensor.go_gauge_WS_5h_rolling_remaining
                name: Restbudget
              - entity: sensor.go_gauge_WS_5h_rolling_time_to_reset
                name: Restzeit
              - entity: sensor.go_gauge_WS_5h_rolling_burn_rate
                name: Burn-Rate
              - entity: sensor.go_gauge_WS_5h_rolling_reset
                name: Reset
              - entity: binary_sensor.go_gauge_WS_5h_rolling_rate_limited
                name: Rate-limited

      # --- Fenster: Weekly ---------------------------------------------------
      - type: grid
        columns: 2
        square: false
        cards:
          - type: gauge
            entity: sensor.go_gauge_WS_weekly_usage
            name: Weekly
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 80
              red: 100
          - type: entities
            entities:
              - entity: sensor.go_gauge_WS_weekly_pace
                name: Pace
              - entity: sensor.go_gauge_WS_weekly_forecast
                name: Prognose
              - entity: sensor.go_gauge_WS_weekly_remaining
                name: Restbudget
              - entity: sensor.go_gauge_WS_weekly_time_to_reset
                name: Restzeit
              - entity: sensor.go_gauge_WS_weekly_burn_rate
                name: Burn-Rate
              - entity: sensor.go_gauge_WS_weekly_reset
                name: Reset
              - entity: binary_sensor.go_gauge_WS_weekly_rate_limited
                name: Rate-limited

      # --- Fenster: Monthly --------------------------------------------------
      - type: grid
        columns: 2
        square: false
        cards:
          - type: gauge
            entity: sensor.go_gauge_WS_monthly_usage
            name: Monthly
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 80
              red: 100
          - type: entities
            entities:
              - entity: sensor.go_gauge_WS_monthly_pace
                name: Pace
              - entity: sensor.go_gauge_WS_monthly_forecast
                name: Prognose
              - entity: sensor.go_gauge_WS_monthly_remaining
                name: Restbudget
              - entity: sensor.go_gauge_WS_monthly_time_to_reset
                name: Restzeit
              - entity: sensor.go_gauge_WS_monthly_burn_rate
                name: Burn-Rate
              - entity: sensor.go_gauge_WS_monthly_reset
                name: Reset
              - entity: binary_sensor.go_gauge_WS_monthly_rate_limited
                name: Rate-limited

      # --- Nutzungsverlauf ---------------------------------------------------
      - type: history-graph
        title: Nutzungsverlauf
        hours_to_show: 48
        refresh_interval: 60
        entities:
          - entity: sensor.go_gauge_WS_5h_rolling_usage
            name: 5h rolling
          - entity: sensor.go_gauge_WS_weekly_usage
            name: Weekly
          - entity: sensor.go_gauge_WS_monthly_usage
            name: Monthly

      # --- Steuerung ---------------------------------------------------------
      - type: entities
        title: Steuerung
        entities:
          # Label "Warnschwelle" -> Entity "Warning Threshold"
          - entity: number.go_gauge_warning_threshold_WS
            name: Warnschwelle
          # Label "Ampel Rot-Grenze" -> Entity "Pace Red Limit"
          - entity: number.go_gauge_pace_red_limit_WS
            name: Ampel Rot-Grenze
          # Label "Nutzung Refresh (Minuten)" -> Entity "Usage Refresh (min)"
          - entity: number.go_gauge_usage_refresh_min_WS
            name: Nutzung Refresh (Minuten)
          # Label "Modelle Refresh (Minuten)" -> Entity "Models Refresh (min)"
          - entity: number.go_gauge_models_refresh_min_WS
            name: Modelle Refresh (Minuten)
          # Label "Nutzung Auto-Update" -> Entity "Auto Update Usage"
          - entity: switch.go_gauge_WS_auto_update_usage
            name: Nutzung Auto-Update
          # Label "Modelle Auto-Update" -> Entity "Auto Update Models"
          - entity: switch.go_gauge_WS_auto_update_models
            name: Modelle Auto-Update
          # Friendly Name ohne Workspace-Name: bei mehreren Workspaces wird die
          # entity_id zu button.go_gauge_refresh_2 (siehe README, Gotcha).
          - entity: button.go_gauge_refresh
            name: Aktualisieren

      # --- Modell-Katalog / Konto -------------------------------------------
      - type: entities
        title: Modell-Katalog / Konto
        entities:
          - entity: sensor.go_gauge_models
            name: Modelle (Anzahl)
          - entity: sensor.go_gauge_live_models
            name: Live-Modelle
          - entity: sensor.go_gauge_cheapest_model
            name: Günstigstes Modell
          - entity: sensor.go_gauge_free_models
            name: Free-Modelle
          - entity: binary_sensor.go_gauge_api_reachable
            name: API erreichbar
      - type: markdown
        content: |
          **Live:** {{ states('sensor.go_gauge_live_models') }} von {{ states('sensor.go_gauge_models') }} Modellen · **Günstigstes:** {{ states('sensor.go_gauge_cheapest_model') }} · **Free:** {{ states('sensor.go_gauge_free_models') }}

          Modell-Details (Ranking nach Kosten, vollstaendiger Katalog) stehen
          ausschliesslich in den Attributen `ranking_by_cost` und `catalog_json`
          des Sensors `sensor.go_gauge_models` - es gibt keine Einzel-Entities
          pro Modell.
