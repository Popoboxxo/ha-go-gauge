# =============================================================================
# Go Gauge - Workspace-Matrix (Multi-Workspace-Dashboard)
# -----------------------------------------------------------------------------
# Zweck   : Mehrere Go-Gauge-Workspaces nebeneinander auf einem Dashboard.
#           Pro Workspace wird das decluttering-Template `go_gauge_workspace`
#           einmal instanziiert; das responsive Grid kommt von `layout-card`.
#           Je Kachel: Abo-Status, Refresh-Button, drei KOMPAKTE Fenster-Karten
#           (5h rolling / Weekly / Monthly) mit Nutzung, Prognose, Pace,
#           Restbudget, Reset, Restzeit und Burn-Rate. Das Rate-Limit wird
#           ueber Icon/Farbe plus Text-Hinweis signalisiert (keine separate
#           Rate-Limit-Chip mehr), dazu die Steuerungs-Sektion (Warning
#           Threshold, Pace Red Limit, Auto-Update-Schalter).
#           Oberhalb des Grids: die konto-weite API-Reachability genau einmal.
#           Unterhalb des Grids: das Konto-/Katalog-Panel (Catalog Owner only).
#
# Custom  : benoetigte Frontend-Ressourcen (via HACS installieren, danach Home
#           Assistant neu laden):
#           - decluttering-card-plus  -> custom:decluttering-card-plus (Template)
#                                        Installation als HACS Custom Repository,
#                                        Typ "Dashboard"
#                                        (URL: https://github.com/tempus2016/decluttering-card-plus)
#                                        oder manuell `decluttering-card-plus.js`.
#           - layout-card             -> custom:layout-card (Grid-Layout)
#           - Mushroom                -> custom:mushroom-* (Karten der Kachel)
#           - vertical-stack-in-card  -> custom:vertical-stack-in-card
#                                        (Kachel-Container)
#
#           HA-Mindestversion: 2024.7 (Badges ab 2024.8). decluttering-card-plus
#           registriert optional auch den Alt-Typ `custom:decluttering-card`;
#           neue Dashboards nutzen aber immer `custom:decluttering-card-plus`.
#
# Bindung : entity_ids NIEMALS aus dem Friendly Name raten! Der Friendly Name
#           haengt vom Workspace-Namen und der Systemsprache ab und ist damit
#           NICHT stabil. Stabil ist ausschliesslich der unique_id-Suffix der
#           Entity. Die realen entity_ids zur Laufzeit ueber die Entity-Registry
#           aufloesen (unique_id-Suffix-Match) und die `[[variablen]]` unten
#           entsprechend binden. Siehe docs/dashboards/entity-map.yaml und
#           docs/dashboards/README.md (Abschnitt "workspace-matrix.yaml").
#
# Slugs   : Kanonische englische entity_id-Slugs seit v1.5.0 (v7-Migration;
#           Quelle: custom_components/go_gauge/const.py, ENTITY_ID_MIGRATION).
#           Deutsche Legacy-Slugs (z.B. *_nutzung, *_prognose, *_restbudget)
#           sind ungueltig.
# =============================================================================

decluttering_templates:
  # ---------------------------------------------------------------------------
  # Template-Variablen (pro custom:decluttering-card-plus -> `variables:` gebunden)
  # ---------------------------------------------------------------------------
  # [[ws_name]]     Anzeigename der Kachel (frei waehlbar, z.B. "App").
  #
  # [[slug_a]]      entity_id-Praefix fuer Entities mit TRAILING Fragment:
  #                 usage / reset / rate_limited / subscription_active /
  #                 auto_update_usage / auto_update_models.
  #                 Form: <device>_go_gauge_<workspace> (nur das Praefix; das
  #                 Fragment haengt das Template selbst an).
  #
  # [[slug_b]]      entity_id-Praefix fuer Entities mit TRAILING Fragment:
  #                 forecast / pace / remaining / time_to_reset / burn_rate.
  #                 Kann bei gemischt migrierten Registries vom [[slug_a]]-
  #                 Praefix abweichen (Device-Praefix-Drift) - siehe
  #                 entity-map.yaml und E2E-v7-entity-id-migration-2026-09-12.md.
  #
  # [[num_slug]]    entity_id-Praefix fuer number-Entities mit LEADING Fragment:
  #                 Form <device>_go_gauge. Das Fragment (warning_threshold)
  #                 und [[num_suffix]] folgen.
  #
  # [[num_suffix]]  Workspace-Suffix der number-Entities (z.B. "_app"); ergibt
  #                 zusammen number.[[num_slug]]_warning_threshold[[num_suffix]].
  #
  # [[ampel_id]]    VOLLE entity_id der Pace-Red-Limit-Number, da der
  #                 Workspace-Slug variiert:
  #                 number.<device>_go_gauge_pace_red_limit_<workspace>.
  #
  # [[refresh_btn]] VOLLE entity_id des Refresh-Buttons (button.<...>_refresh).
  #                 Der Button ist workspace-unabhaengig benannt und kollidiert
  #                 bei mehreren Workspaces -> reale entity_id aus der Registry
  #                 holen (unique_id-Suffix _refresh).
  # ---------------------------------------------------------------------------
  go_gauge_workspace:
    default:
      - ws_name: "Workspace"
    card:
      type: custom:vertical-stack-in-card
      cards:
        # --- Header: Abo + Refresh -------------------------------------------
        # API-Reachability ist NICHT Teil der Kachel: binary_sensor.
        # go_gauge_api_reachable ist konto-weit und existiert genau einmal
        # (Catalog Owner) -> globale Kopfzeile ueber dem Grid.
        - type: custom:mushroom-chips-card
          alignment: center
          chips:
            # Abo-Status icon-only (content_info: none); der State ergibt sich
            # aus der Icon-Farbe (an/aus).
            - type: entity
              entity: binary_sensor.[[slug_a]]_subscription_active
              icon: mdi:shield-check-outline
              content_info: none
            - type: action
              icon: mdi:refresh
              tap_action:
                action: call-service
                service: button.press
                target:
                  entity_id: [[refresh_btn]]

        - type: custom:mushroom-title-card
          title: "[[ws_name]]"
          subtitle: Nutzung & Steuerung

        # --- Window: 5h rolling (eine kompakte Karte) -------------------------
        - type: custom:mushroom-template-card
          entity: sensor.[[slug_a]]_5h_rolling_usage
          primary: >-
            {%- set v = states('sensor.[[slug_a]]_5h_rolling_usage') -%}
            5h Rolling: {{ '–' if v in ['unknown', 'unavailable', 'none', ''] else v }}%
          # secondary: mehrzeilig via Jinja-Whitespace-Control + '\n'
          # (der YAML-Block-Skalar selbst foldet nur zu einer Quellzeile).
          secondary: >-
            {%- set dash = '–' -%}
            {%- macro v(e) -%}
            {%- set s = states(e) -%}
            {{- dash if s in ['unknown', 'unavailable', 'none', ''] else s -}}
            {%- endmacro -%}
            {%- macro ts(e) -%}
            {%- set s = states(e) -%}
            {{- dash if s in ['unknown', 'unavailable', 'none', ''] else as_timestamp(s) | timestamp_custom('%d.%m. %H:%M', true) -}}
            {%- endmacro -%}
            Prog: {{ v('sensor.[[slug_b]]_5h_rolling_forecast') }}%{{- '\n' -}}
            Pace: {{ v('sensor.[[slug_b]]_5h_rolling_pace') }}{{- '\n' -}}
            Rem: {{ v('sensor.[[slug_b]]_5h_rolling_remaining') }}%{{- '\n' -}}
            Reset: {{ ts('sensor.[[slug_a]]_5h_rolling_reset') }}{{- '\n' -}}
            Restzeit: {{ v('sensor.[[slug_b]]_5h_rolling_time_to_reset') }} h{{- '\n' -}}
            Burn: {{ v('sensor.[[slug_b]]_5h_rolling_burn_rate') }} %/h
            {%- if is_state('binary_sensor.[[slug_a]]_5h_rolling_rate_limited', 'on') -%}
            {{- '\n' -}}⚠ RATE-LIMITED
            {%- endif -%}
          icon: >-
            {%- if is_state('binary_sensor.[[slug_a]]_5h_rolling_rate_limited', 'on') -%}
            mdi:alert-octagon
            {%- else -%}
            mdi:speedometer
            {%- endif -%}
          icon_color: >-
            {%- if is_state('binary_sensor.[[slug_a]]_5h_rolling_rate_limited', 'on') -%}
            red
            {%- else -%}
            {%- set p = states('sensor.[[slug_b]]_5h_rolling_pace') -%}
            {%- if p == 'red' -%}red{%- elif p == 'yellow' -%}orange{%- else -%}green{%- endif -%}
            {%- endif -%}
          tap_action:
            action: more-info

        # --- Window: Weekly (eine kompakte Karte) -----------------------------
        - type: custom:mushroom-template-card
          entity: sensor.[[slug_a]]_weekly_usage
          primary: >-
            {%- set v = states('sensor.[[slug_a]]_weekly_usage') -%}
            Weekly: {{ '–' if v in ['unknown', 'unavailable', 'none', ''] else v }}%
          secondary: >-
            {%- set dash = '–' -%}
            {%- macro v(e) -%}
            {%- set s = states(e) -%}
            {{- dash if s in ['unknown', 'unavailable', 'none', ''] else s -}}
            {%- endmacro -%}
            {%- macro ts(e) -%}
            {%- set s = states(e) -%}
            {{- dash if s in ['unknown', 'unavailable', 'none', ''] else as_timestamp(s) | timestamp_custom('%d.%m. %H:%M', true) -}}
            {%- endmacro -%}
            Prog: {{ v('sensor.[[slug_b]]_weekly_forecast') }}%{{- '\n' -}}
            Pace: {{ v('sensor.[[slug_b]]_weekly_pace') }}{{- '\n' -}}
            Rem: {{ v('sensor.[[slug_b]]_weekly_remaining') }}%{{- '\n' -}}
            Reset: {{ ts('sensor.[[slug_a]]_weekly_reset') }}{{- '\n' -}}
            Restzeit: {{ v('sensor.[[slug_b]]_weekly_time_to_reset') }} h{{- '\n' -}}
            Burn: {{ v('sensor.[[slug_b]]_weekly_burn_rate') }} %/h
            {%- if is_state('binary_sensor.[[slug_a]]_weekly_rate_limited', 'on') -%}
            {{- '\n' -}}⚠ RATE-LIMITED
            {%- endif -%}
          icon: >-
            {%- if is_state('binary_sensor.[[slug_a]]_weekly_rate_limited', 'on') -%}
            mdi:alert-octagon
            {%- else -%}
            mdi:speedometer
            {%- endif -%}
          icon_color: >-
            {%- if is_state('binary_sensor.[[slug_a]]_weekly_rate_limited', 'on') -%}
            red
            {%- else -%}
            {%- set p = states('sensor.[[slug_b]]_weekly_pace') -%}
            {%- if p == 'red' -%}red{%- elif p == 'yellow' -%}orange{%- else -%}green{%- endif -%}
            {%- endif -%}
          tap_action:
            action: more-info

        # --- Window: Monthly (eine kompakte Karte) ----------------------------
        - type: custom:mushroom-template-card
          entity: sensor.[[slug_a]]_monthly_usage
          primary: >-
            {%- set v = states('sensor.[[slug_a]]_monthly_usage') -%}
            Monthly: {{ '–' if v in ['unknown', 'unavailable', 'none', ''] else v }}%
          secondary: >-
            {%- set dash = '–' -%}
            {%- macro v(e) -%}
            {%- set s = states(e) -%}
            {{- dash if s in ['unknown', 'unavailable', 'none', ''] else s -}}
            {%- endmacro -%}
            {%- macro ts(e) -%}
            {%- set s = states(e) -%}
            {{- dash if s in ['unknown', 'unavailable', 'none', ''] else as_timestamp(s) | timestamp_custom('%d.%m. %H:%M', true) -}}
            {%- endmacro -%}
            Prog: {{ v('sensor.[[slug_b]]_monthly_forecast') }}%{{- '\n' -}}
            Pace: {{ v('sensor.[[slug_b]]_monthly_pace') }}{{- '\n' -}}
            Rem: {{ v('sensor.[[slug_b]]_monthly_remaining') }}%{{- '\n' -}}
            Reset: {{ ts('sensor.[[slug_a]]_monthly_reset') }}{{- '\n' -}}
            Restzeit: {{ v('sensor.[[slug_b]]_monthly_time_to_reset') }} h{{- '\n' -}}
            Burn: {{ v('sensor.[[slug_b]]_monthly_burn_rate') }} %/h
            {%- if is_state('binary_sensor.[[slug_a]]_monthly_rate_limited', 'on') -%}
            {{- '\n' -}}⚠ RATE-LIMITED
            {%- endif -%}
          icon: >-
            {%- if is_state('binary_sensor.[[slug_a]]_monthly_rate_limited', 'on') -%}
            mdi:alert-octagon
            {%- else -%}
            mdi:speedometer
            {%- endif -%}
          icon_color: >-
            {%- if is_state('binary_sensor.[[slug_a]]_monthly_rate_limited', 'on') -%}
            red
            {%- else -%}
            {%- set p = states('sensor.[[slug_b]]_monthly_pace') -%}
            {%- if p == 'red' -%}red{%- elif p == 'yellow' -%}orange{%- else -%}green{%- endif -%}
            {%- endif -%}
          tap_action:
            action: more-info

        # --- Control ---
        - type: custom:mushroom-title-card
          title: Steuerung
        - type: grid
          columns: 2
          square: false
          cards:
            # Label "Warnschwelle" -> Entity "Warning Threshold"
            - type: custom:mushroom-number-card
              entity: number.[[num_slug]]_warning_threshold[[num_suffix]]
              name: Warnschwelle
              display_mode: buttons
              icon: none
            # Label "Ampel Limit" -> Entity "Pace Red Limit"
            - type: custom:mushroom-number-card
              entity: [[ampel_id]]
              name: Ampel Limit
              display_mode: buttons
              icon: none
            # Label "Auto Nutzung" -> Entity "Auto Update Usage"
            - type: custom:mushroom-entity-card
              entity: switch.[[slug_a]]_auto_update_usage
              name: Auto Nutzung
              icon: mdi:autorenew
              tap_action:
                action: toggle
            # Label "Auto Modelle" -> Entity "Auto Update Models"
            - type: custom:mushroom-entity-card
              entity: switch.[[slug_a]]_auto_update_models
              name: Auto Modelle
              icon: mdi:autorenew
              tap_action:
                action: toggle

title: Go Gauge Matrix
views:
  - title: "Go Gauge Workspaces"
    path: go-gauge-workspaces
    icon: mdi:view-dashboard
    panel: true
    cards:
      # --- Globale Kopfzeile: API-Reachability (Konto-Ebene) ------------------
      # binary_sensor.go_gauge_api_reachable ist KONTO-WEIT und existiert genau
      # einmal (Catalog Owner) - deshalb global ueber dem Grid statt pro Kachel.
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: entity
            entity: binary_sensor.go_gauge_api_reachable
            icon: mdi:cloud-check-outline
            content_info: state

      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: "1fr 1fr 1fr 1fr"
          grid-gap: "16px"
          mediaquery:
            "(max-width: 1200px)":
              grid-template-columns: "1fr 1fr"
            "(max-width: 600px)":
              grid-template-columns: "1fr"
        cards:
          # Beispiel-Workspace "App": die Slugs werden ueber den
          # unique_id-Suffix aus der Entity-Registry ermittelt (NIE raten).
          - type: custom:decluttering-card-plus
            template: go_gauge_workspace
            variables:
              - ws_name: "App"
              - slug_a: "go_gauge_ha_go_gauge_app"
              - slug_b: "software_go_gauge_app"
              - num_slug: "go_gauge_ha_go_gauge"
              - num_suffix: "_app"
              - ampel_id: "number.software_go_gauge_app_go_gauge_pace_red_limit_app"
              - refresh_btn: "button.go_gauge_ha_go_gauge_refresh_3"

      # --- Modell-Katalog / Konto (Catalog Owner only / genau einmal) ---------
      # Konto-weites Panel unterhalb des Grids; die Account-Entities existieren
      # genau einmal (Catalog Owner), nicht pro Workspace.
      - type: entities
        title: Modell-Katalog / Konto
        entities:
          - entity: sensor.go_gauge_models
            name: Model-Catalog
          - entity: sensor.go_gauge_live_models
            name: Live-Models-Count
          - entity: sensor.go_gauge_cheapest_model
            name: Cheapest Model
          - entity: sensor.go_gauge_free_models
            name: Free Models
