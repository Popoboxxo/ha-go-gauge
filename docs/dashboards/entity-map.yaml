# Go Gauge - maschinenlesbare Entity-Map (Dashboard-Bindung).
#
# Zweck: Sie beschreibt, welche Entities die Integration anlegt und wie eine
# dashboard-erzeugende KI die STABILE Bindung herstellt. entity_id ist NICHT
# stabil (HA slugifiziert den Friendly Name inkl. Workspace-Name und
# Systemsprache). Stabil ist ausschliesslich der unique_id-Suffix.
#
# Bindungsregel: Entities zur Laufzeit ueber die HA Entity-Registry aufloesen
# und ueber unique_id_template / unique_id_suffix matchen. NIEMALS entity_ids
# aus dem Friendly Name raten. `WS` ist ein Platzhalter fuer den realen
# Workspace-Slug innerhalb einer entity_id.
#
# Sprache: Die `name_pattern`-Felder tragen die kanonischen ENGLISCHEN
# Anzeigenamen (v1.5.0 / v6-Namensmigration). `unique_id_suffix` /
# `unique_id_template` bleiben unveraendert - sie koennen semantisch vom
# entity_id-Slug abweichen (z.B. `_percent` vs. entity_id `_usage`) und sind
# bereits englisch. entity_id-Slugs sind seit v1.5.0 ebenfalls englisch
# (v7-Migration, Quelle: const.py `ENTITY_ID_MIGRATION`).
#
# Pflege: Bei jeder Aenderung an custom_components/go_gauge/* nachziehen.
# Abgeglichen mit: v2.0.0 (Konto-Entry-Architektur: eigene, automatisch
# angelegte Konto-Entry `unique_id = go_gauge_account` besitzt die Konto-
# Entities und -Settings; Workspace-Entries sind reine Usage-Instanzen) -
# sensor.py, binary_sensor.py, number.py, switch.py, button.py, entity.py,
# account.py, account_logic.py, const.py. Historische v7-Slug-Migration
# (ENTITY_ID_MIGRATION) bleibt gueltig.

version: 1
domain: go_gauge
workspace_placeholders:
  WS: "<workspace-slug in entity_id; derive from unique_id suffix, never from friendly name>"
windows:
  - key: "5h"
    label: "5h rolling"
    entity_id_part: "5h_rolling"
  - key: "week"
    label: "Weekly"
    entity_id_part: "weekly"
  - key: "month"
    label: "Monthly"
    entity_id_part: "monthly"
devices:
  workspace:
    name_pattern: "Go Gauge {ws_name}"
    identifiers: "go_gauge / <entry_id>"
  account:
    name_pattern: "Go Gauge Konto"
    identifiers: "go_gauge / account"
    entry: "account"
    owner_note: >-
      Gehoert der genau einmal vorhandenen, automatisch angelegten Konto-Entry
      (unique_id "go_gauge_account", Titel "Go Gauge Konto"). Nie manuell
      anlegen; nach dem Loeschen wird sie beim naechsten Workspace-Setup bzw.
      HA-Start neu erzeugt.
entities:
  # --- pro Fenster (window_specific: true) -----------------------------------
  - logical: usage_percent
    platform: sensor
    device: workspace
    unique_id_suffix: "_percent"
    unique_id_template: "{entry_id}_{workspace_key}_{window}_percent"
    name_pattern: "Go Gauge {WS} {window_label} Usage"
    window_specific: true
    unit: "%"
    state_class: measurement
    attributes: [workspace_key, window, status, note, resets_at_iso]
    source: "sensor.py:105-165"
  - logical: reset
    platform: sensor
    device: workspace
    unique_id_suffix: "_reset"
    unique_id_template: "{entry_id}_{workspace_key}_{window}_reset"
    name_pattern: "Go Gauge {WS} {window_label} Reset"
    window_specific: true
    device_class: timestamp
    source: "sensor.py:168-190"
  - logical: forecast
    platform: sensor
    device: workspace
    unique_id_suffix: "_forecast"
    unique_id_template: "{entry_id}_{workspace_key}_{window}_forecast"
    name_pattern: "Go Gauge {WS} {window_label} Forecast"
    window_specific: true
    unit: "%"
    state_class: measurement
    note: "Kann > 100 sein (bewusst; zeigt Budgetueberschreitung am Fensterende)."
    source: "sensor.py:193-219"
  - logical: pace
    platform: sensor
    device: workspace
    unique_id_suffix: "_pace"
    unique_id_template: "{entry_id}_{workspace_key}_{window}_pace"
    name_pattern: "Go Gauge {WS} {window_label} Pace"
    window_specific: true
    attributes: [forecast_percent, green_below, red_above]
    note: "State ist ein englischer String: green | yellow | red."
    source: "sensor.py:222-259"
  - logical: remaining
    platform: sensor
    device: workspace
    unique_id_suffix: "_remaining"
    unique_id_template: "{entry_id}_{workspace_key}_{window}_remaining"
    name_pattern: "Go Gauge {WS} {window_label} Remaining"
    window_specific: true
    unit: "%"
    state_class: measurement
    source: "sensor.py:262-284"
  - logical: time_to_reset
    platform: sensor
    device: workspace
    unique_id_suffix: "_time_to_reset"
    unique_id_template: "{entry_id}_{workspace_key}_{window}_time_to_reset"
    name_pattern: "Go Gauge {WS} {window_label} Time to Reset"
    window_specific: true
    device_class: duration
    unit: "h"
    source: "sensor.py:287-306"
  - logical: burn_rate
    platform: sensor
    device: workspace
    unique_id_suffix: "_burn_rate"
    unique_id_template: "{entry_id}_{workspace_key}_{window}_burn_rate"
    name_pattern: "Go Gauge {WS} {window_label} Burn-Rate"
    window_specific: true
    unit: "%/h"
    state_class: measurement
    source: "sensor.py:309-330"
  - logical: rate_limited
    platform: binary_sensor
    device: workspace
    unique_id_suffix: "_limited"
    unique_id_template: "{entry_id}_{workspace_key}_{window}_limited"
    name_pattern: "Go Gauge {WS} {window_label} rate-limited"
    window_specific: true
    device_class: problem
    source: "binary_sensor.py:63-96"

  # --- Workspace-Ebene (window_specific: false) ------------------------------
  - logical: subscription_active
    platform: binary_sensor
    device: workspace
    unique_id_suffix: "_subscription_active"
    unique_id_template: "{entry_id}_{workspace_key}_subscription_active"
    name_pattern: "Go Gauge {WS} Subscription Active"
    window_specific: false
    device_class: connectivity
    attributes: [workspace_key, note]
    source: "binary_sensor.py:99-136"
  - logical: warn_percent
    platform: number
    device: workspace
    unique_id_suffix: "_warn_percent"
    unique_id_template: "{entry_id}_warn_percent"
    name_pattern: "Go Gauge Warning Threshold \u00b7 {WS}"
    window_specific: false
    unit: "%"
    min: 1
    max: 100
    default: 80
    note: "Gruen/Gelb-Grenze der Pace-Ampel."
    source: "number.py:102-122"
  - logical: pace_red_percent
    platform: number
    device: workspace
    unique_id_suffix: "_pace_red_percent"
    unique_id_template: "{entry_id}_pace_red_percent"
    name_pattern: "Go Gauge Pace Red Limit \u00b7 {WS}"
    window_specific: false
    unit: "%"
    min: 1
    max: 300
    default: 100
    note: "Gelb/Rot-Grenze der Pace-Ampel."
    source: "number.py:125-145"
  - logical: usage_refresh_minutes
    platform: number
    device: workspace
    unique_id_suffix: "_usage_refresh_minutes"
    unique_id_template: "{entry_id}_usage_refresh_minutes"
    name_pattern: "Go Gauge Usage Refresh (min) \u00b7 {WS}"
    window_specific: false
    unit: "min"
    min: 1
    max: 1440
    default: 10
    source: "number.py:148-169"
  - logical: auto_update_usage
    platform: switch
    device: workspace
    unique_id_suffix: "_auto_update_usage"
    unique_id_template: "{entry_id}_auto_update_usage"
    name_pattern: "Go Gauge {WS} Auto Update Usage"
    window_specific: false
    source: "switch.py:56-83"
  - logical: refresh
    platform: button
    device: workspace
    unique_id_suffix: "_refresh"
    unique_id_template: "{entry_id}_refresh"
    name_pattern: "Go Gauge Refresh"
    window_specific: false
    note: "Laedt NUR Usage (setzt last_usage_fetch zurueck); der Katalog-Refresh ist der Konto-Button account_refresh."
    source: "button.py:45-64"

  # --- Konto-Ebene (workspace-unabhaengig, Konto-Entry) ----------------------
  # Alle Eintraege gehoeren der automatisch angelegten Konto-Entry
  # (`account_entry: true`) und dem Device (DOMAIN, "account"). Bestehende
  # Installationen behalten ihre entity_id; verbindlich ist die unique_id.
  - logical: model_catalog
    platform: sensor
    device: account
    unique_id_suffix: "account_model_catalog"
    unique_id_template: "account_model_catalog"
    name_pattern: "Go Gauge Konto Models"
    window_specific: false
    state_class: measurement
    account_entry: true
    attributes: [catalog_json, ranking_by_cost, free_models, cheapest_model, cheapest_overall, count, live_count, models_updated_at, account_auto_update_models, account_fetch_interval_minutes, account_models_refresh_minutes, account_last_models_outcome]
    note: "State = Anzahl. Es gibt KEINE Einzel-Entities pro Modell. Die vier account_*-Attribute spiegeln die globalen Konto-Settings (Basis- vs. effektives Intervall inkl. Backoff)."
    source: "sensor.py:333-420"
  - logical: models_live_count
    platform: sensor
    device: account
    unique_id_suffix: "account_models_live_count"
    unique_id_template: "account_models_live_count"
    name_pattern: "Go Gauge Konto Live Models"
    window_specific: false
    state_class: measurement
    account_entry: true
    source: "sensor.py:423-437"
  - logical: cheapest_model
    platform: sensor
    device: account
    unique_id_suffix: "account_cheapest_model"
    unique_id_template: "account_cheapest_model"
    name_pattern: "Go Gauge Konto Cheapest Model"
    window_specific: false
    account_entry: true
    attributes: [cheapest_overall, ratio_usd_per_1m]
    source: "sensor.py:440-460"
  - logical: free_models
    platform: sensor
    device: account
    unique_id_suffix: "account_free_models"
    unique_id_template: "account_free_models"
    name_pattern: "Go Gauge Konto Free Models"
    window_specific: false
    account_entry: true
    note: "State = kommagetrennte Liste der kostenlosen Modelle."
    source: "sensor.py:463-474"
  - logical: api_reachable
    platform: binary_sensor
    device: account
    unique_id_suffix: "account_api_reachable"
    unique_id_template: "account_api_reachable"
    name_pattern: "Go Gauge Konto API Reachable"
    window_specific: false
    device_class: connectivity
    account_entry: true
    attributes: [reachability_reason, evidence, models_ttl_s, usage_ttl_s, checked_at]
    note: >-
      Evidenz-/TTL-basiert: ON bei mindestens einem frischen Erfolg (Katalog-
      oder Usage-Fetch); unknown, wenn die API antwortet, aber keinen Erfolg
      belegt (401/kein Abo) oder keine frische Evidenz vorliegt; OFF nur bei
      ausschliesslich frischen Fehlschlaegen. TTL: Modelle 2x Konto-Basis-
      intervall (Fallback 120 min bei Auto-Refresh aus), Usage 3x Workspace-
      Intervall. Ein 5-Minuten-Publish-Tick schreibt den Zustand neu, ohne HTTP.
    source: "binary_sensor.py:139-184"
  - logical: account_refresh
    platform: button
    device: account
    unique_id_suffix: "account_refresh"
    unique_id_template: "account_refresh"
    name_pattern: "Refresh account"
    window_specific: false
    account_entry: true
    note: "Laedt NUR den Modell-Katalog (AccountCoordinator.async_fetch_now); loest keinen Usage-Fetch aus."
    source: "button.py:67-79"
  - logical: account_auto_update_models
    platform: switch
    device: account
    unique_id_suffix: "account_auto_update_models"
    unique_id_template: "account_auto_update_models"
    name_pattern: "Go Gauge Konto Auto Update Models"
    window_specific: false
    account_entry: true
    default: true
    note: "Globale Konto-Einstellung (ersetzt die frueheren Workspace-Modell-Regler); wirkt live ohne Reload."
    source: "switch.py:85-116"
  - logical: account_models_refresh_minutes
    platform: number
    device: account
    unique_id_suffix: "account_models_refresh_minutes"
    unique_id_template: "account_models_refresh_minutes"
    name_pattern: "Go Gauge Konto Models Refresh (min)"
    window_specific: false
    account_entry: true
    unit: "min"
    min: 1
    max: 1440
    default: 60
    note: "Basisintervall des Katalog-Fetch; das effektive Intervall kann bei 403/Netzfehler per Backoff bis 60 min wachsen. Value = Basis, nicht Backoff."
    source: "number.py:172-201"
