name: Validate

# Least privilege: every job only reads the repository (checkout, hacs/action,
# hassfest and the local scripts). No job writes back to the repo.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hassfest validation
        uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install "pytest>=9,<10" "pytest-asyncio>=1,<2" "voluptuous>=0.14,<1"
      # Tests use the repo's own Home Assistant stubs (tests/conftest.py),
      # so no real homeassistant package is required.
      - name: Run tests
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install "ruff>=0.16,<0.17"
      - name: Ruff lint
        run: ruff check .

  json-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check JSON meta-files + translation key parity
        run: python scripts/check_json_consistency.py

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install mypy
        run: pip install "mypy>=2,<3"
      # Config-driven: pyproject.toml selects the integration package and sets
      # ignore_missing_imports (homeassistant is intentionally not installed).
      - name: Run mypy
        run: mypy
